<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid</title>
  </head>
  <body>
    <style>
      .grid {
        display: grid;
        grid-template-columns: repeat(12, minmax(auto, 1fr));
        /* grid-template-columns: repeat(12, minmax(0, 1fr));  */
        grid-auto-rows: 100px;
        gap: 1rem;
      }

      .grid > div {
        border: 1px solid black;
      }
    </style>

    <section class="grid">
      <div>Item 1</div>
      <div>Item 2</div>
      <div>Item 3</div>
      <div>Item 4</div>
      <div>Item 5</div>
      <div>Item 6</div>
    </section>
  </body>
</html>
