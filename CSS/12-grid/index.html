<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid intro</title>
  </head>
  <body>
    <style>
      .co-grid {
        display: grid;
        grid-template-columns: 1fr;
        @media (width >= 767px) {
          grid-template-columns: repeat(3, 1fr);
        }

        grid-auto-rows: minmax(250px, auto);
        gap: 1rem;
      }

      .co-grid div {
        padding: 1rem;
      }

      .co-grid div:nth-child(1) {
        grid-column: 1;
        grid-row: 1 / 3;
      }

      .co-grid div:nth-child(2) {
        grid-column: 2 / 4;
      }

      .co-post {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .co-post__title {
        color: white;
        grid-row: 2/3;
        vertical-align: middle;
        line-height: 1.5;
      }

      .co-uppercase {
        text-transform: uppercase;
      }

      .co-text-lg {
        font-size: 2rem;
      }

      .co-text-xl {
        font-size: 2.5rem;
      }

      .co-yellow {
        color: #ff7c23;
      }

      .co-text-center {
        text-align: center;
      }

      .co-text-bold {
        font-weight: bold;
      }

      .co-text-shadow {
        text-shadow: 1px 1px 3px black;
      }

      #post-1 {
        background-image: url("http://coboxin.site/wp-content/uploads/2024/02/Superficies-metalicas.webp");
        background-size: cover;
      }

      #post-2 {
        background-image: url("http://coboxin.site/wp-content/uploads/2024/02/Muebles-y-accesorios.webp");
        background-size: cover;
      }

      #post-3 {
        background-image: url("http://coboxin.site/wp-content/uploads/2024/02/Proteccion-en-rejas.webp");
        background-size: cover;
      }

      #post-4 {
        background-image: url("http://coboxin.site/wp-content/uploads/2024/02/Barandales.webp");
        background-size: cover;
      }
    </style>
    <section class="co-grid">
      <div class="co-post" id="post-1">
        <h3 class="co-post__title co-text-center co-text-bold co-text-shadow">
          <span class="co-uppercase co-text-lg">Descubre cómo</span><br />
          <span class="co-uppercase co-text-xl co-yellow">COBOXÍN</span><br />
          puede ser usado en una amplica gama de superficies metálicas
        </h3>
      </div>
      <div class="co-post" id="post-2">
        <h3
          class="co-post__title co-text-center co-text-bold co-text-shadow co-text-lg"
        >
          Detiene el óxido sobre muebles y accesorios de jardín
        </h3>
      </div>
      <div class="co-post" id="post-3">
        <h3
          class="co-post__title co-text-center co-text-bold co-text-shadow co-text-lg"
        >
          Protección segura en rejas
        </h3>
      </div>
      <div class="co-post" id="post-4">
        <h3
          class="co-post__title co-text-center co-text-bold co-text-shadow co-text-lg"
        >
          Vuelve a la vida barandales llenos de óxido
        </h3>
      </div>
    </section>
  </body>
</html>
